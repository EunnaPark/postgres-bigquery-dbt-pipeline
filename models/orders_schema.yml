version: 2

models:
  - name: stg_orders
    description: >-
      Current order state replicated from PostgreSQL through Datastream.
      Grain: one row per order_id. All statuses are retained; status is trimmed
      and lowercased. This view is not an order-event history.
    columns:
      - name: order_id
        description: "Source order identifier (PostgreSQL bigint); primary key and upsert key. Python requires a positive integer; dbt checks uniqueness and non-nullness."
        data_tests:
          - unique
          - not_null

      - name: order_date
        description: "Business order date (DATE), supplied as YYYY-MM-DD. Used to group completed revenue; not the ingestion date. No timezone conversion is applied."
        data_tests:
          - not_null

      - name: amount
        description: "Order amount from PostgreSQL numeric(10,2). Must be nonnegative and strictly positive for completed orders. Synthetic data assumes one unspecified currency; not a net-revenue measure. Checked by not_null and assert_valid_order_amount."
        data_tests:
          - not_null

      - name: status
        description: "Current normalized order status. Allowed values are pending, completed, cancelled and refunded. Only completed contributes to completed_revenue."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pending
                  - completed
                  - cancelled
                  - refunded
      - name: customer_id
        description: "Synthetic customer identifier (PostgreSQL bigint). Required and positive in Python validation. dbt checks non-nullness and that every value exists in dim_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: updated_at
        description: "Source modification timestamp (PostgreSQL timestamptz). Defaults to CURRENT_TIMESTAMP on insert and is explicitly set by the loader on upsert updates, including unchanged values. Not a BigQuery arrival time or CDC latency measure."

  - name: fct_daily_sales
    description: >-
      Daily aggregation of current completed orders from stg_orders.
      Grain: one row per order_date with at least one completed order.
      Rebuilt as a table by dbt; dates without completed orders are absent.
      Historical totals can change when order status, amount or existence changes.
    columns:
      - name: order_date
        description: "Business order date and grouping key, inherited from stg_orders.order_date."
      - name: order_count
        description: "COUNT(*) of orders currently marked completed on this date; excludes pending, cancelled and refunded orders."
      - name: completed_revenue
        description: "SUM(amount) of orders currently marked completed on this date, in the same assumed currency as amount. No separate tax, refund or currency-conversion calculation. Validated by manual source-to-mart comparison; assert_customer_revenue_reconciles checks that its total matches dim_customers."

  - name: dim_customers
    description: >-
      Customer dimension derived from current orders in stg_orders, because the
      source has no separate customer table. Grain: one row per customer_id that
      has at least one current order of any status. Rebuilt as a table by dbt;
      a customer disappears if all of their orders are deleted at the source.
    columns:
      - name: customer_id
        description: "Customer identifier and primary key, inherited from stg_orders.customer_id."
        data_tests:
          - unique
          - not_null
      - name: first_order_date
        description: "Earliest order_date across the customer's current orders of any status."
        data_tests:
          - not_null
      - name: last_order_date
        description: "Latest order_date across the customer's current orders of any status."
        data_tests:
          - not_null
      - name: order_count
        description: "COUNT(*) of the customer's current orders across all statuses; always at least 1."
        data_tests:
          - not_null
      - name: completed_order_count
        description: "Number of the customer's orders currently marked completed; can be 0."
        data_tests:
          - not_null
      - name: completed_revenue
        description: "SUM(amount) of the customer's completed orders, 0 when none. Same definition as fct_daily_sales.completed_revenue; assert_customer_revenue_reconciles checks that both marts have the same total. Not net revenue."
        data_tests:
          - not_null
