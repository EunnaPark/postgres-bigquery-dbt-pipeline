version: 2

models:
  - name: stg_orders
    description: "Current orders replicated from PostgreSQL through Datastream."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: order_date
        data_tests:
          - not_null

      - name: amount
        data_tests:
          - not_null

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pending
                  - completed
                  - cancelled
                  - refunded